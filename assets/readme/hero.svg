<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">本地生图工作台 Local Image Studio — 本地多模型 AI 批量生图工作台</title>
  <desc id="desc">深蓝紫暗色工作台风标题：本地生图工作台，副标题提示词、队列与作品，一个工作台管完；右侧是迷你工作台示意：提示词输入、生成队列与已完成的图片网格。</desc>

  <rect width="1200" height="360" rx="26" fill="#151522"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#a5a3c8">本地 AI 生图工作台 · LOCAL IMAGE STUDIO</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#f4f4f8">本地生图工作台</text>
    <text x="56" y="168" font-size="23" fill="#d4d2e8">LOCAL IMAGE STUDIO — 提示词、队列、作品一屏管完</text>
    <text x="56" y="204" font-size="19" fill="#b0aec9">多模型批量生图，推理交给 ComfyUI，本机跑、数据存本地。</text>
    <g id="chips" font-size="18" fill="#e8e8f2" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#23233a" stroke="#3d3d5c" stroke-width="1.5"/><text x="119" y="262">4 个模型方案</text></g>
      <g><rect x="194" y="238" width="216" height="36" rx="18" fill="#23233a" stroke="#3d3d5c" stroke-width="1.5"/><text x="302" y="262">批量 · 每批最多 1000 张</text></g>
      <g><rect x="422" y="238" width="198" height="36" rx="18" fill="#23233a" stroke="#3d3d5c" stroke-width="1.5"/><text x="521" y="262">队列暂停 / 排序 / 打乱</text></g>
    </g>
  </g>

  <g id="workbench" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="760" y="40" width="384" height="280" rx="14" fill="#1e1e33" stroke="#33334d" stroke-width="1.5"/>
    <g id="wb-header">
      <rect x="784" y="60" width="336" height="34" rx="8" fill="#2a2a44"/>
      <text x="800" y="83" font-size="18" fill="#e8e8f2">Z-Image-Turbo</text>
      <rect x="1024" y="66" width="80" height="22" rx="11" fill="#14532d"/>
      <text x="1064" y="82" font-size="18" fill="#bbf7d0" text-anchor="middle">已连接</text>
    </g>
    <g id="wb-prompt">
      <rect x="784" y="106" width="160" height="86" rx="8" fill="#262640"/>
      <text x="796" y="130" font-size="18" fill="#a5a3c8">提示词</text>
      <text x="796" y="156" font-size="18" fill="#e8e8f2">天坛，3D 卡通</text>
      <text x="796" y="180" font-size="18" fill="#e8e8f2">东方明珠，Q 版</text>
    </g>
    <g id="wb-queue">
      <rect x="956" y="106" width="164" height="86" rx="8" fill="#262640"/>
      <text x="968" y="130" font-size="18" fill="#a5a3c8">生成队列</text>
      <rect x="968" y="142" width="140" height="10" rx="5" fill="#33334d"/>
      <rect x="968" y="142" width="136" height="10" rx="5" fill="#8b5cf6"/>
    </g>
    <g id="wb-progress-text" font-size="18" fill="#e8e8f2">
      <text x="968" y="180">35 / 36 · 97%</text>
    </g>
    <g id="wb-gallery">
      <rect x="784" y="204" width="104" height="88" rx="8" fill="#7c3aed"/>
      <circle cx="836" cy="236" r="16" fill="#fbbf24"/>
      <path d="M784 280 Q810 258 836 272 Q862 286 888 266 L888 292 L784 292 Z" fill="#4c1d95"/>
      <rect x="900" y="204" width="104" height="88" rx="8" fill="#0ea5e9"/>
      <circle cx="952" cy="232" r="14" fill="#fef3c7"/>
      <path d="M900 276 Q926 254 952 268 Q978 282 1004 262 L1004 292 L900 292 Z" fill="#075985"/>
      <rect x="1016" y="204" width="104" height="88" rx="8" fill="#f59e0b"/>
      <circle cx="1068" cy="238" r="15" fill="#7c2d12"/>
      <path d="M1016 278 Q1042 258 1068 270 Q1094 282 1120 264 L1120 292 L1016 292 Z" fill="#92400e"/>
    </g>
    <g id="wb-caption" font-size="18" fill="#a5a3c8" text-anchor="middle">
      <text x="952" y="312">提示词 → 队列 → 作品，一屏看完</text>
    </g>
  </g>
</svg>
